# 打 tag 后自动发布到 npm 并创建 GitHub Release
#
# 触发方式（在本地）：
#   npm version patch   # 修改 package.json + 打 vX.Y.Z tag + 自动 commit
#   git push --follow-tags
#
# 这个动作会：
#   1. 检出代码；
#   2. 校验 tag 与 package.json 的版本一致（防「忘了升版本就打 tag」）；
#   3. 跑完整 CI（构建 + 单测 + 安装自检）；
#   4. 发布到 npm（public access）；
#   5. 在对应 tag 上创建 GitHub Release（含自动生成的变更说明）。
#
# 前置条件：
#   1. 仓库 Settings → Secrets and variables → Actions 里添加 NPM_TOKEN，
#      值取 npm **Granular Access Token**，且务必勾选 "Bypass two-factor authentication"
#      （npm 已于 2025-12-09 废弃 Classic Token，只能用 Granular Token）。
#   2. 该 token 的 package 权限要覆盖 @qgynisc/dsh-alert-sounds。
#
# 注意：上游 dsh-alert-sound 用的是 npm 可信发布（OIDC + `npm stage publish`），
# 那是上游在自己包上配的权限，对本包不适用，所以这里走 NPM_TOKEN。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # 防呆：tag 与 package.json 版本必须一致，否则只会得到一个语焉不详的冲突报错
      - name: 校验 tag 与 package.json 版本一致
        run: |
          EXPECTED="v$(node -p "require('./package.json').version")"
          if [ "$EXPECTED" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $EXPECTED 不一致，拒绝发布"
            exit 1
          fi
          echo "✔ tag $GITHUB_REF_NAME 与 package.json 一致"

      # 本包零运行时依赖，peerDependencies 里的 @deepseek-ai/cordis 是 DSH 自带私有包，
      # 所以**不跑 npm install**（跑了反而会因为装不上 peer 而报错）。
      # prepublishOnly 会把构建再做一遍，lib/ 必须已在仓库里。
      - name: 构建 + 单测 + 安装自检
        run: npm run test:ci

      - name: 发布到 npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
